name: Skill drift detection

on:
  schedule:
    - cron: "23 14 * * 1" # weekly, Monday 14:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Check out published skills repo
        uses: actions/checkout@v4

      - name: Check out private library mirror
        uses: actions/checkout@v4
        with:
          repository: Dennis-J-Carroll/skills-library
          token: ${{ secrets.LIBRARY_TOKEN }}
          path: library

      - name: Debug layout
        run: |
          pwd
          ls -la
          echo "--- library ---"
          ls -la library | head -20

      - name: Scan the library mirror
        run: |
          chmod +x library/skill-shop.sh
          bash library/skill-shop.sh scan --root "$GITHUB_WORKSPACE/library"

      - name: Detect drift
        id: drift
        env:
          # the published repo root IS the monorepo root
          SKILL_SHOP_PUB_SKILLS: ${{ github.workspace }}
        run: |
          set +e
          bash library/skill-shop.sh drift --report > drift-report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "--- drift report ---"
          cat drift-report.md
          exit 0

      - name: Open, update, or close the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT_CODE: ${{ steps.drift.outputs.code }}
        run: |
          TITLE="Skill drift detected: library has moved ahead of this repo"
          get_open_issue() {
            gh issue list --state open --search "$TITLE in:title" \
              --json number --jq '.[0].number // ""'
          }
          footer="_Auto-generated by the skill drift workflow on $(date -u +'%Y-%m-%d %H:%M UTC'). Fix per skill: ./skill-shop.sh publish <name> (locally); this issue auto-closes when a run finds everything in sync._"
          if [ "$DRIFT_CODE" != "0" ]; then
            body="$(cat drift-report.md)
            $footer"
            num="$(get_open_issue)"
            if [ -n "$num" ]; then
              gh issue edit "$num" --body "$body"
              gh issue comment "$num" --body "Still drifting as of $(date -u +'%Y-%m-%d')."
            else
              gh issue create --title "$TITLE" --body "$body"
            fi
          else
            num="$(get_open_issue)"
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "Resolved — published state matches the library as of $(date -u +'%Y-%m-%d %H:%M UTC'). ✅"
            else
              echo "In sync; no open drift issue."
            fi
          fi
